<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>내 프로필 카드</title>
  <style>
    :root { --bg: #F4F6F5; --card: #FFFFFF; --ink: #1B2420; --sub: #5F6B66; --accent: #0F7B6C; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg);
           font-family: system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; color: var(--ink); }
    .card { width: min(360px, calc(100vw - 32px)); background: var(--card); border-radius: 16px; padding: 28px;
            box-shadow: 0 1px 2px rgba(0,0,0,.06), 0 8px 24px rgba(0,0,0,.06); }
    .tag { display: inline-block; font-size: 13px; color: var(--accent); border: 1px solid var(--accent);
           border-radius: 999px; padding: 2px 10px; }
    h1 { margin: 12px 0 4px; font-size: 24px; }
    p { margin: 0; color: var(--sub); line-height: 1.6; }
  </style>
</head>
<body>
  <main class="card">
    <span class="tag">디자인</span>
    <h1>권지영</h1>
    <p>안녕하세요 디자이너 직군 권지영입니다 </p>
  </main>
</body>
</html>
